<svg xmlns="http://www.w3.org/2000/svg" width="840" height="728" viewBox="0 0 840 728">
  <defs>
    <marker id="data" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L8,5 L1,9" fill="none" stroke="#e6e6e6" stroke-width="1.2"/></marker>
    <marker id="obs" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L8,5 L1,9" fill="none" stroke="#9a9a9a" stroke-width="1.2"/></marker>
    <marker id="gov" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L8,5 L1,9" fill="none" stroke="#8fa3cc" stroke-width="1.2"/></marker>
    <marker id="cmd" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#d4654a"/></marker>
  </defs>
  <g font-family="'Helvetica Neue', Helvetica, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" fill="#e6e6e6">
    <text x="20" y="36" font-size="17" font-weight="700">picasso-narrator: 판정 옆에서 판정 없이 설명 부착</text>
    <text x="20" y="56" font-size="12" fill="#9a9a9a">picasso 호출 없음. 내보낸 파일 묶음 입력, 사건당 Nexus 1회 질의, 설명 기록 출력</text>
    <text x="820" y="36" font-size="11" fill="#9a9a9a" text-anchor="end">picasso 코드에 이 계층 호출 지점 없음</text>
    <text x="820" y="52" font-size="11" fill="#9a9a9a" text-anchor="end">구성요소 다섯 중 LLM 호출은 explainer 하나</text>
    <rect x="32" y="88" width="208" height="592" fill="none" stroke="#4a4a4a"/>
    <text x="44" y="104" font-size="11" fill="#9a9a9a">picasso: 판정, 대안 탐색, 승인</text>
    <rect x="288" y="88" width="264" height="592" fill="none" stroke="#8fa3cc"/>
    <text x="300" y="104" font-size="11" fill="#8fa3cc" font-weight="700">picasso-narrator: 설명 계층</text>
    <text x="300" y="120" font-size="11" fill="#9a9a9a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">python -m receiver &lt;한 벌&gt;</text>
    <text x="300" y="136" font-size="11" fill="#9a9a9a">--approve 시에만 승인 시도, 기본 꺼짐</text>
    <rect x="600" y="88" width="208" height="592" fill="none" stroke="#4a4a4a"/>
    <text x="612" y="104" font-size="11" fill="#9a9a9a">khala Nexus: 검색, 인용 검증</text>
    <rect x="48" y="124" width="176" height="52" fill="#1a1a1a" stroke="#4a4a4a"/>
    <text x="60" y="145" font-size="12" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">picasso</text>
    <text x="60" y="161" font-size="11" fill="#9a9a9a">사건 판정과 대안 탐색</text>
    <rect x="48" y="220" width="176" height="52" fill="#1a1a1a" stroke="#4a4a4a"/>
    <text x="60" y="241" font-size="12" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">handoff/narrator/</text>
    <text x="60" y="257" font-size="11" fill="#9a9a9a">picasso 산출 파일 묶음</text>
    <rect x="48" y="316" width="136" height="52" fill="#1a1a1a" stroke="#4a4a4a"/>
    <text x="60" y="337" font-size="12" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">ApprovalHost</text>
    <text x="60" y="353" font-size="11" fill="#9a9a9a">호출자 자격 판정</text>
    <rect x="304" y="220" width="232" height="52" fill="#232a3a" stroke="#8fa3cc" stroke-width="1.5"/>
    <text x="316" y="241" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">receiver</text>
    <text x="316" y="257" font-size="11" fill="#9a9a9a">미처리 사건 선별. 승인 시도 기록</text>
    <rect x="304" y="316" width="232" height="52" fill="#232a3a" stroke="#8fa3cc" stroke-width="1.5"/>
    <text x="316" y="337" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">composer</text>
    <text x="316" y="353" font-size="11" fill="#9a9a9a">파일 묶음 사실만으로 정형 질의 생성</text>
    <rect x="304" y="412" width="232" height="52" fill="#8fa3cc" stroke="#8fa3cc" stroke-width="1.5"/>
    <rect x="308" y="416" width="224" height="44" fill="none" stroke="#1a1a1a" stroke-width="0.75" stroke-opacity="0.6"/>
    <text x="316" y="433" font-size="12.5" fill="#1a1a1a" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">explainer</text>
    <text x="316" y="449" font-size="11" fill="#2b3f6b">사건별 Nexus 호출. 유일한 LLM 접점</text>
    <rect x="304" y="508" width="232" height="52" fill="#232a3a" stroke="#8fa3cc" stroke-width="1.5"/>
    <text x="316" y="529" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">recorder</text>
    <text x="316" y="545" font-size="11" fill="#9a9a9a">결과를 네 종류로 나누어 기록</text>
    <rect x="304" y="604" width="232" height="52" fill="#232a3a" stroke="#8fa3cc" stroke-width="1.5"/>
    <text x="316" y="625" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">corpus.export</text>
    <text x="316" y="641" font-size="11" fill="#9a9a9a">khala 적재 형식의 설명 기록 내보내기</text>
    <rect x="616" y="124" width="176" height="52" fill="#1a1a1a" stroke="#4a4a4a"/>
    <text x="628" y="145" font-size="12" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">tenant picasso</text>
    <text x="628" y="161" font-size="11" fill="#9a9a9a">문서와 합성 SOP 여섯 편</text>
    <rect x="616" y="412" width="176" height="52" fill="#1a1a1a" stroke="#4a4a4a"/>
    <text x="628" y="433" font-size="12" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Nexus</text>
    <text x="628" y="449" font-size="11" fill="#9a9a9a">하이브리드 검색. 인용 검증</text>
    <rect x="616" y="604" width="176" height="52" fill="#1a1a1a" stroke="#4a4a4a"/>
    <text x="628" y="625" font-size="12" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">tenant narrator</text>
    <text x="628" y="641" font-size="11" fill="#9a9a9a">설명 기록. 운영자 질의 근거</text>
    <path d="M136,176 V218" fill="none" stroke="#e6e6e6" stroke-width="1.2" marker-end="url(#data)"/>
    <text x="144" y="201" font-size="10.5">파일 묶음 내보냄</text>
    <path d="M224,246 H302" fill="none" stroke="#e6e6e6" stroke-width="1.2" marker-end="url(#data)"/>
    <text x="244" y="239" font-size="10.5">읽기</text>
    <path d="M420,272 V314" fill="none" stroke="#e6e6e6" stroke-width="1.2" marker-end="url(#data)"/>
    <text x="428" y="297" font-size="10.5">사건의 사실 전달</text>
    <path d="M420,368 V410" fill="none" stroke="#e6e6e6" stroke-width="1.2" marker-end="url(#data)"/>
    <text x="428" y="393" font-size="10.5">질의 전달</text>
    <path d="M420,464 V506" fill="none" stroke="#e6e6e6" stroke-width="1.2" marker-end="url(#data)"/>
    <text x="428" y="489" font-size="10.5">답, 인용 전달</text>
    <path d="M420,560 V602" fill="none" stroke="#e6e6e6" stroke-width="1.2" marker-end="url(#data)"/>
    <text x="428" y="585" font-size="10.5">설명 기록 전달</text>
    <path d="M536,438 H614" fill="none" stroke="#e6e6e6" stroke-width="1.2" marker-end="url(#data)"/>
    <text x="556" y="431" font-size="10.5">1회 질의</text>
    <path d="M704,176 V410" fill="none" stroke="#e6e6e6" stroke-width="1.2" marker-end="url(#data)"/>
    <text x="712" y="300" font-size="10.5">근거 문서 제공</text>
    <path d="M536,630 H614" fill="none" stroke="#e6e6e6" stroke-width="1.2" marker-end="url(#data)"/>
    <text x="556" y="623" font-size="10.5">적재</text>
    <path d="M704,604 V466" fill="none" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#obs)"/>
    <text x="712" y="540" font-size="10.5" fill="#9a9a9a">운영자 질의 전용</text>
    <path d="M304,262 H264 V342 H186" fill="none" stroke="#d4654a" stroke-width="2" marker-end="url(#cmd)"/>
    <text x="190" y="335" font-size="10.5" fill="#d4654a">승인시도</text>
    <path d="M20,708 H44" fill="none" stroke="#e6e6e6" stroke-width="1.2"/>
    <text x="52" y="712" font-size="10.5" fill="#9a9a9a">데이터 흐름</text>
    <path d="M128,708 H152" fill="none" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="5 3"/>
    <text x="160" y="712" font-size="10.5" fill="#9a9a9a">관측</text>
    <path d="M200,708 H224" fill="none" stroke="#d4654a" stroke-width="2"/>
    <text x="232" y="712" font-size="10.5" fill="#9a9a9a">명령, 쓰기</text>
    <rect x="304" y="700" width="16" height="12" fill="#232a3a" stroke="#8fa3cc" stroke-width="1.5"/>
    <text x="328" y="712" font-size="10.5" fill="#9a9a9a">이 저장소</text>
    <rect x="392" y="700" width="16" height="12" fill="#8fa3cc" stroke="#8fa3cc"/>
    <text x="416" y="712" font-size="10.5" fill="#9a9a9a">LLM 호출</text>
    <rect x="476" y="700" width="16" height="12" fill="none" stroke="#4a4a4a"/>
    <text x="500" y="712" font-size="10.5" fill="#9a9a9a">외부 시스템</text>
    <text x="820" y="712" font-size="10.5" fill="#9a9a9a" text-anchor="end">picasso로 승인 시도만</text>
