<svg xmlns="http://www.w3.org/2000/svg" width="840" height="840" viewBox="0 0 840 840" font-family="Malgun Gothic,Apple SD Gothic Neo,Noto Sans KR,Segoe UI,-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="am" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#57606a"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0969da"/></marker>
    <marker id="aw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9a6700"/></marker>
  </defs>
  <rect x="6" y="6" width="828" height="828" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <text x="32" y="46" font-size="17" font-weight="600" fill="#1f2328">진단 — 바깥 루프가 부르는 안쪽 루프 (Diagnosis as the Inner Loop)</text>
  <text x="32" y="70" font-size="12.5" fill="#57606a">진단은 계산된 후보 가운데 하나를 가리킬 뿐이다 — 실행은 koshei 정책과 picasso 승인 창구를 지나고, 조치 자동 승인은 꺼져 있다</text>

  <!-- lanes -->
  <rect x="32" y="96" width="232" height="536" rx="10" fill="#fbfcfd" stroke="#e6e9ee"/>
  <text x="48" y="116" font-size="11" font-weight="700" fill="#8b95a1" letter-spacing="1">KOSHEI — 바깥 루프</text>
  <rect x="32" y="652" width="232" height="104" rx="10" fill="#fbfcfd" stroke="#e6e9ee"/>
  <rect x="296" y="96" width="256" height="660" rx="10" fill="#eef5ff" stroke="#cfe0f5"/>
  <text x="312" y="116" font-size="11" font-weight="700" fill="#0969da" letter-spacing="1">NARRATOR — 진단 액티비티</text>
  <rect x="584" y="96" width="224" height="660" rx="10" fill="#fbfcfd" stroke="#e6e9ee"/>
  <text x="600" y="116" font-size="11" font-weight="700" fill="#8b95a1" letter-spacing="1">KHALA/NEXUS — 검색 · 인용 검증</text>

  <!-- notes -->
  <rect x="48" y="134" width="200" height="44" rx="6" fill="#ffffff" stroke="#e6e9ee"/>
  <text x="148" y="152" font-size="11" fill="#57606a" text-anchor="middle">Temporal 사가 플랫폼 koshei</text>
  <text x="148" y="168" font-size="11" fill="#57606a" text-anchor="middle">결정적 에피소드 상태기계</text>
  <rect x="312" y="134" width="224" height="44" rx="6" fill="#ffffff" stroke="#cfe0f5"/>
  <text x="424" y="152" font-size="11" fill="#57606a" text-anchor="middle">python -m diagnose.worker</text>
  <text x="424" y="168" font-size="11" fill="#57606a" text-anchor="middle">큐 narrator-tq · 계약 0.6</text>
  <rect x="596" y="134" width="200" height="44" rx="6" fill="#ffffff" stroke="#e6e9ee"/>
  <text x="696" y="152" font-size="11" fill="#57606a" text-anchor="middle">Bearer 인증 · 읽기 전용 신원</text>
  <text x="696" y="168" font-size="11" fill="#57606a" text-anchor="middle">설계 문서 · 과거 사례는 뺀다</text>

  <!-- koshei lane -->
  <rect x="48" y="222" width="200" height="72" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="148" y="246" font-size="12.5" fill="#1f2328" text-anchor="middle">에피소드 — DIAGNOSING</text>
  <text x="148" y="264" font-size="11" fill="#57606a" text-anchor="middle">스냅샷 · 후보 투영 · 이력</text>
  <text x="148" y="280" font-size="11" fill="#57606a" text-anchor="middle">진단을 액티비티로 부른다</text>

  <rect x="48" y="440" width="200" height="72" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="148" y="464" font-size="12.5" fill="#1f2328" text-anchor="middle">정책 v1 — 자동 승인 판정</text>
  <text x="148" y="482" font-size="11" fill="#9a6700" text-anchor="middle">APPROVE_REMEDY 는 꺼 두었다</text>
  <text x="148" y="498" font-size="11" fill="#57606a" text-anchor="middle">깨끗함 = 두 목록이 비었는가</text>

  <rect x="48" y="556" width="200" height="58" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="148" y="580" font-size="12.5" fill="#1f2328" text-anchor="middle">사람 — 넘김 · 승인</text>
  <text x="148" y="598" font-size="11" fill="#57606a" text-anchor="middle">ESCALATE 와 조치 제안 모두</text>

  <rect x="48" y="686" width="200" height="58" rx="6" fill="#f6f8fa" stroke="#9a6700"/>
  <text x="148" y="710" font-size="12.5" fill="#1f2328" text-anchor="middle">승인 창구 — picasso</text>
  <text x="148" y="728" font-size="11" fill="#9a6700" text-anchor="middle">자격 선언과 대조한다</text>

  <!-- narrator lane -->
  <rect x="312" y="222" width="224" height="72" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="424" y="246" font-size="12.5" fill="#1f2328" text-anchor="middle">요청 해독 — 계약 0.6</text>
  <text x="424" y="264" font-size="11" fill="#57606a" text-anchor="middle">후보는 글자 별칭으로만 보인다</text>
  <text x="424" y="280" font-size="11" fill="#57606a" text-anchor="middle">모르는 모양은 거절한다</text>

  <rect x="312" y="338" width="224" height="58" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="424" y="362" font-size="12.5" fill="#1f2328" text-anchor="middle">질의 · 자료 칸</text>
  <text x="424" y="380" font-size="11" fill="#57606a" text-anchor="middle">검색할 문장과 보일 자료를 가른다</text>

  <rect x="312" y="440" width="224" height="72" rx="6" fill="#ddf4ff" stroke="#0969da"/>
  <text x="424" y="464" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">explainer — 진단당 한 번</text>
  <text x="424" y="482" font-size="11" fill="#0969da" text-anchor="middle">LLM 이 닿는 유일한 조각</text>
  <text x="424" y="498" font-size="11" fill="#57606a" text-anchor="middle">설명 바퀴와 같은 클라이언트</text>

  <rect x="312" y="556" width="224" height="72" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="424" y="580" font-size="12.5" fill="#1f2328" text-anchor="middle">판정 — 결과 넷</text>
  <text x="424" y="598" font-size="11" fill="#57606a" text-anchor="middle">RECOMMENDED · NO_GROUNDS</text>
  <text x="424" y="614" font-size="11" fill="#57606a" text-anchor="middle">UNCITED · OUT_OF_CANDIDATES</text>

  <path d="M312,672 a112,9 0 0 1 224,0 l0,58 a112,9 0 0 1 -224,0 Z" fill="#f6f8fa" stroke="#d0d7de"/>
  <path d="M312,672 a112,9 0 0 0 224,0" fill="none" stroke="#d0d7de"/>
  <text x="424" y="698" font-size="12.5" fill="#1f2328" text-anchor="middle">첫 결과 저장소</text>
  <text x="424" y="716" font-size="11" fill="#57606a" text-anchor="middle">시도마다 한 결과 · 다시 오면 되돌린다</text>

  <!-- khala lane -->
  <path d="M596,222 a100,9 0 0 1 200,0 l0,58 a100,9 0 0 1 -200,0 Z" fill="#f6f8fa" stroke="#d0d7de"/>
  <path d="M596,222 a100,9 0 0 0 200,0" fill="none" stroke="#d0d7de"/>
  <text x="696" y="248" font-size="12.5" fill="#1f2328" text-anchor="middle">테넌트 picasso</text>
  <text x="696" y="266" font-size="11" fill="#57606a" text-anchor="middle">picasso 문서 + 합성 SOP 여섯</text>

  <rect x="596" y="440" width="200" height="72" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="696" y="464" font-size="12.5" fill="#1f2328" text-anchor="middle">Nexus — 검색 · 인용 검증</text>
  <text x="696" y="482" font-size="11" fill="#57606a" text-anchor="middle">POST /search/answer</text>
  <text x="696" y="498" font-size="11" fill="#57606a" text-anchor="middle">answer_context · 판 칸 다섯</text>

  <rect x="596" y="556" width="200" height="44" rx="6" fill="#ffffff" stroke="#e6e9ee"/>
  <text x="696" y="574" font-size="11" fill="#57606a" text-anchor="middle">검색이 죽으면 degraded 에 싣는다</text>
  <text x="696" y="590" font-size="11" fill="#57606a" text-anchor="middle">진단 응답에는 아직 없다</text>

  <!-- activity call (control) -->
  <polyline points="248,258 312,258" fill="none" stroke="#0969da" stroke-width="1.6" marker-end="url(#ab)"/>

  <!-- narrator chain -->
  <polyline points="424,294 424,338" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#am)"/>
  <text x="432" y="320" font-size="11" fill="#57606a">별칭표 · 후보 판</text>
  <polyline points="424,396 424,440" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#am)"/>
  <text x="432" y="422" font-size="11" fill="#57606a">질의와 자료 칸</text>
  <polyline points="424,512 424,556" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#am)"/>
  <text x="432" y="538" font-size="11" fill="#57606a">답 · 인용 · 판 칸</text>
  <polyline points="424,628 424,663" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#am)"/>
  <text x="432" y="650" font-size="11" fill="#57606a">첫 결과</text>

  <!-- nexus side -->
  <polyline points="536,476 596,476" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#am)"/>
  <polyline points="696,289 696,440" fill="none" stroke="#57606a" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#am)"/>
  <text x="702" y="366" font-size="11" fill="#57606a">근거</text>

  <!-- response back to the episode -->
  <polyline points="312,592 280,592 280,270 248,270" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#am)"/>
  <text x="258" y="410" font-size="11" fill="#57606a" text-anchor="end">응답 — 결과와 두 목록</text>

  <!-- koshei side -->
  <polyline points="100,294 100,440" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#am)"/>
  <text x="108" y="370" font-size="11" fill="#57606a">정책 표를 본다</text>
  <polyline points="148,512 148,556" fill="none" stroke="#9a6700" stroke-width="1.6" marker-end="url(#aw)"/>
  <text x="156" y="538" font-size="11" fill="#9a6700">사람에게</text>
  <polyline points="148,614 148,686" fill="none" stroke="#9a6700" stroke-width="1.6" marker-end="url(#aw)"/>
  <text x="156" y="645" font-size="11" fill="#9a6700">승인되면 시도</text>

  <!-- the automatic path, switched off -->
  <polyline points="48,492 40,492 40,715 48,715" fill="none" stroke="#9a6700" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#aw)"/>
  <text x="48" y="645" font-size="11" fill="#9a6700">자동 — 꺼짐</text>
  <g><rect x="141" y="661" width="14" height="16" fill="#fbfcfd"/>
     <text x="48" y="672" font-size="11" font-weight="700" fill="#8b95a1" letter-spacing="1">PICASSO — 실행의 문</text></g>

  <!-- footer -->
  <rect x="32" y="770" width="776" height="48" rx="6" fill="#fbfcfd" stroke="#e6e9ee"/>
  <text x="44" y="790" font-size="11" fill="#57606a">후보는 picasso 가 계산하고 koshei 가 투영한다 · 진단은 그 가운데 하나를 가리키고, 후보 밖은 결정적으로 버린다</text>
  <text x="44" y="808" font-size="10" fill="#8b95a1">파란 실선은 액티비티 호출, 회색 실선은 데이터 흐름, 주황은 사람과 승인 시도, 주황 점선은 꺼 둔 길 · 조치 자동 승인은 권고 측정의 결과로 꺼졌다</text>
</svg>
