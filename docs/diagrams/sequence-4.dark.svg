<svg xmlns="http://www.w3.org/2000/svg" width="840" height="808" viewBox="0 0 840 808">
  <defs>
    <marker id="data" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L8,5 L1,9" fill="none" stroke="#e6e6e6" stroke-width="1.2"/></marker>
    <marker id="obs" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L8,5 L1,9" fill="none" stroke="#9a9a9a" stroke-width="1.2"/></marker>
    <marker id="gov" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L8,5 L1,9" fill="none" stroke="#8fa3cc" stroke-width="1.2"/></marker>
    <marker id="cmd" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L9,5 L0,9 Z" fill="#d4654a"/></marker>
  </defs>
  <g font-family="'Helvetica Neue', Helvetica, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" fill="#e6e6e6">
    <text x="20" y="36" font-size="17" font-weight="700">운영 경로 4: 설명 지연이나 실패 시 사건 처리 완료</text>
    <text x="20" y="56" font-size="12" fill="#9a9a9a">운영자 승인이 설명보다 먼저 진행되며 승인 시점에 설명 칸은 비어 있고 실패 시 기록 1줄만 남음</text>
    <text x="20" y="72" font-size="12" fill="#9a9a9a">화면이 설명을 기다리게 되는 경우 LLM 이 운영 경로 안에 들어온 상태를 뜻함</text>
    <path d="M92,140 V744" fill="none" stroke="#4a4a4a"/>
    <path d="M228,140 V744" fill="none" stroke="#4a4a4a"/>
    <path d="M364,140 V744" fill="none" stroke="#4a4a4a"/>
    <path d="M500,140 V744" fill="none" stroke="#4a4a4a"/>
    <path d="M636,140 V744" fill="none" stroke="#4a4a4a"/>
    <path d="M772,140 V744" fill="none" stroke="#4a4a4a"/>
    <rect x="32" y="156" width="776" height="224" fill="none" stroke="#4a4a4a"/>
    <text x="44" y="172" font-size="11" fill="#9a9a9a">사건 처리 경로: 설명 없이 완료</text>
    <rect x="32" y="412" width="776" height="332" fill="none" stroke="#8fa3cc"/>
    <text x="44" y="428" font-size="11" fill="#8fa3cc" font-weight="700">설명 경로: 뒤늦게 실행, 실패 시 기록 1줄</text>
    <rect x="32" y="92" width="120" height="48" fill="#1a1a1a" stroke="#4a4a4a"/>
    <text x="44" y="113" font-size="12" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">operator</text>
    <text x="44" y="129" font-size="11" fill="#9a9a9a">사람</text>
    <rect x="168" y="92" width="120" height="48" fill="#1a1a1a" stroke="#4a4a4a"/>
    <text x="180" y="113" font-size="12" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">picasso</text>
    <text x="180" y="129" font-size="11" fill="#9a9a9a">판정. 내보내기</text>
    <rect x="304" y="92" width="120" height="48" fill="#1a1a1a" stroke="#4a4a4a"/>
    <text x="316" y="113" font-size="12" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">handoff</text>
    <text x="316" y="129" font-size="11" fill="#9a9a9a">읽기 전용 폴더</text>
    <rect x="440" y="92" width="120" height="48" fill="#232a3a" stroke="#8fa3cc" stroke-width="1.5"/>
    <text x="452" y="113" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">receiver</text>
    <text x="452" y="129" font-size="11" fill="#9a9a9a">수신. 재시도</text>
    <rect x="576" y="92" width="120" height="48" fill="#8fa3cc" stroke="#8fa3cc" stroke-width="1.5"/>
    <rect x="580" y="96" width="112" height="40" fill="none" stroke="#1a1a1a" stroke-width="0.75" stroke-opacity="0.6"/>
    <text x="588" y="113" font-size="12.5" fill="#1a1a1a" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">explainer</text>
    <text x="588" y="129" font-size="11" fill="#2b3f6b">설명 생성 (LLM)</text>
    <rect x="712" y="92" width="120" height="48" fill="#1a1a1a" stroke="#4a4a4a"/>
    <text x="724" y="113" font-size="12" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Nexus</text>
    <text x="724" y="129" font-size="11" fill="#9a9a9a">검색. 인용 검증</text>
    <path d="M228,200 H362" fill="none" stroke="#e6e6e6" stroke-width="1.2" marker-end="url(#data)"/>
    <text x="296" y="193" font-size="10.5" text-anchor="middle">번들, 제안 파일 쓰기</text>
    <path d="M228,232 H94" fill="none" stroke="#e6e6e6" stroke-width="1.2" marker-end="url(#data)"/>
    <text x="160" y="225" font-size="10.5" text-anchor="middle">차단 통지(승인 필요)</text>
    <rect x="40" y="248" width="244" height="44" fill="#1a1a1a" stroke="#4a4a4a"/>
    <text x="52" y="266" font-size="11">운영자가 사건을 이미 앎</text>
    <text x="52" y="282" font-size="11" fill="#9a9a9a">설명 칸이 비어 있음</text>
    <path d="M92,320 H226" fill="none" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="6 2.5 1.5 2.5" marker-end="url(#obs)"/>
    <text x="160" y="313" font-size="10.5" fill="#9a9a9a" text-anchor="middle">설명 없이 승인</text>
    <path d="M228,352 H362" fill="none" stroke="#e6e6e6" stroke-width="1.2" marker-end="url(#data)"/>
    <text x="296" y="345" font-size="10.5" text-anchor="middle">실행 결과 파일 쓰기</text>
    <text x="420" y="400" font-size="11" fill="#9a9a9a" text-anchor="middle">사건 처리 종료, 뒤늦게 실행되는 설명 경로</text>
    <path d="M500,456 H366" fill="none" stroke="#e6e6e6" stroke-width="1.2" marker-end="url(#data)"/>
    <text x="432" y="449" font-size="10.5" text-anchor="middle">뒤늦은 번들 조회</text>
    <path d="M364,488 H498" fill="none" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#obs)"/>
    <text x="432" y="481" font-size="10.5" fill="#9a9a9a" text-anchor="middle">번들 전체 전달</text>
    <rect x="440" y="508" width="360" height="144" fill="none" stroke="#9a9a9a"/>
    <text x="452" y="524" font-size="11" fill="#9a9a9a" font-weight="700">재시도 최대 3회 (사건 처리를 기다리지 않음)</text>
    <path d="M500,556 H634" fill="none" stroke="#e6e6e6" stroke-width="1.2" marker-end="url(#data)"/>
    <text x="568" y="549" font-size="10.5" text-anchor="middle">설명 요청</text>
    <path d="M636,588 H770" fill="none" stroke="#e6e6e6" stroke-width="1.2" marker-end="url(#data)"/>
    <text x="704" y="581" font-size="10.5" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" text-anchor="middle">POST /search/answer</text>
    <path d="M772,612 H638" fill="none" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#obs)"/>
    <text x="704" y="605" font-size="10.5" fill="#9a9a9a" text-anchor="middle">시간 초과 또는 오류</text>
    <path d="M636,640 H502" fill="none" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#obs)"/>
    <text x="568" y="633" font-size="10.5" fill="#9a9a9a" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" text-anchor="middle">NexusUnavailable</text>
    <rect x="380" y="672" width="240" height="56" fill="#232a3a" stroke="#8fa3cc" stroke-width="1.5"/>
    <text x="392" y="694" font-size="12.5" font-weight="700">생성 실패 (재시도 3/3)</text>
    <text x="392" y="712" font-size="11" fill="#9a9a9a">(runId, digest) 설명 기록 1건</text>
    <path d="M20,780 H44" fill="none" stroke="#e6e6e6" stroke-width="1.2"/>
    <text x="52" y="784" font-size="10.5" fill="#9a9a9a">메시지</text>
    <path d="M104,780 H128" fill="none" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="5 3"/>
    <text x="136" y="784" font-size="10.5" fill="#9a9a9a">응답</text>
    <path d="M176,780 H200" fill="none" stroke="#9a9a9a" stroke-width="1.2" stroke-dasharray="6 2.5 1.5 2.5"/>
    <text x="208" y="784" font-size="10.5" fill="#9a9a9a">수동 행동</text>
    <text x="820" y="784" font-size="10.5" fill="#9a9a9a" text-anchor="end">운영자가 나중에 보는 상태: 진행 중, 실패, 근거 없음, 인용 없는 답</text>
  </g>
