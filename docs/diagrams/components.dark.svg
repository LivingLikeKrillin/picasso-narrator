  <text x="44" y="968" font-size="11" fill="#8b949e">LLM 을 부르는 조각은 explainer 뿐이고(tests/test_explainer_once.py), 두 채점기는 기록만 읽는 순수 함수라 실물 스택 없이 다시 센다</text>
