  </defs>
  <rect x="6" y="6" width="828" height="1008" rx="14" fill="#0d1117" stroke="#30363d"/>
  <text x="32" y="46" font-size="17" font-weight="600" fill="#c9d1d9">구성 — 다섯 조각, LLM 은 하나 (Composition)</text>
  <text x="32" y="70" font-size="12.5" fill="#8b949e">설명 바퀴는 파일 한 벌을 읽고 진단 액티비티는 koshei 의 요청을 받는다 — 둘 다 같은 질의 구성과 같은 explainer 를 거친다</text>
  <text x="32" y="90" font-size="12.5" fill="#8b949e">채점은 순수 함수라 실행 기록만 있으면 스택 없이 다시 센다 · 사례 파일과 정답표의 변경은 훅이 알리거나 막는다</text>

  <!-- zone A: the two paths -->
  <rect x="32" y="116" width="776" height="322" rx="10" fill="#101a28" stroke="#22334d"/>
  <text x="48" y="136" font-size="11" font-weight="700" fill="#58a6ff" letter-spacing="1">두 길 — python -m receiver 는 파일 한 벌을, python -m diagnose.worker 는 koshei 의 요청을 받는다</text>

