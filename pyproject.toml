[project]
name = "picasso-narrator"
version = "0.1.0"
description = "사건 번들을 읽어 원인 설명과 검증된 근거 인용을 내놓는 층. picasso 의 소비자."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: 실물 Nexus 스택이 필요하다. 기본 시험군은 픽스처로 돈다"]
addopts = '-m "not live"'

[tool.setuptools]
packages = ["receiver", "composer", "explainer", "recorder"]
